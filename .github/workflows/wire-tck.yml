# Diagnostic comparison is deliberately separate from ordinary Ember CI.
name: HTTP wire comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        scala: ['2.12.21', '2.13.18', '3.3.8']
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v27
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - name: Compare all targets and reconcile every case
        run: nix develop '.#temurin@17' -c sbt --client ';++${{ matrix.scala }};tckCompare'
      - name: Preserve outcomes and wire evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wire-tck-${{ matrix.scala }}
          path: target/wire-tck-reports/
          if-no-files-found: error
